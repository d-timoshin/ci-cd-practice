name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ
        run: docker build -t ci-cd-practice:ci .

      - name: Показать версию Python в контейнере
        run: docker run --rm ci-cd-practice:ci python --version

      - name: Запустить тесты в контейнере
        run: docker run --rm ci-cd-practice:ci
