name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ
        run: docker build -t ci-cd-practice:ci .

      - name: Создать папку для отчётов
        run: mkdir -p reports

      - name: Запустить тесты в контейнере
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          docker run --rm \
            -e BASE_URL -e TEST_PASSWORD \
            -v "$PWD/reports:/app/reports" \
            ci-cd-practice:ci \
            pytest --junitxml=reports/report.xml

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
