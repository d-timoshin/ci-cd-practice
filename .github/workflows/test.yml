name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ
        run: docker build -t ci-cd-practice:ci .

      - name: Создать папку для отчётов
        run: mkdir -p reports

      - name: Запустить тесты в контейнере
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          docker run --rm \
            -e BASE_URL -e TEST_PASSWORD \
            -v "$PWD/reports:/app/reports" \
            ci-cd-practice:ci \
            pytest --junitxml=reports/report.xml

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

      - name: Отправить уведомление в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Тесты ${GITHUB_REPOSITORY}: ${JOB_STATUS}. Подробности: ${RUN_URL}"
          curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"
