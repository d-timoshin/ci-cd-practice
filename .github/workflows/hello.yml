name: Hello QA Workflow # Задаем имя workflow, которое будет видно в интерфейсе GitHub
on: # Указываем раздел триггеров (событий), при которых будет запускаться workflow
  pull_request: # Выбираем событие "Pull Request"
jobs: # Открываем раздел с задачами (jobs), которые нужно выполнить
  hello_qa: # Придумываем уникальное имя для нашей задачи (job)
    runs-on: ubuntu-latest # Указываем, что задача должна выполняться на виртуальной машине с Ubuntu
    steps: # Открываем раздел с шагами (steps), которые последовательно выполняются внутри задачи
      - name: Print Hello # Задаем человекочитаемое название для шага, чтобы было понятно, что он делает
        run: echo "Hello, QA!" # Выполняем консольную команду echo, которая выводит нужный текст в лог
